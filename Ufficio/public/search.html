<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerca Ticket Storici</title>
  <link rel="stylesheet" href="./public/css/styles.css?v=1.4.12" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-top"><img class="brand-logo" src="./public/assets/prodops-logo.svg?v=1.4.12" alt="PRODOPS Ticket Manager" /><button id="themeToggleBtn" class="theme-switch" type="button" aria-label="Cambia tema" aria-pressed="false"><span class="switch-track"><span class="switch-thumb">L</span></span></button></div>
      <div class="sidebar-actions">
        <button id="openAdminBtn" class="admin-toggle-btn" type="button">Admin Panel</button>
        <a class="sidebar-link-btn" href="./index.html">Dashboard</a>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>
      <div class="sidebar-footer">Powered by Antonio Di Bella 2026</div>
    </aside>

    <main class="content">
      <section class="panel ticket-search-panel">
        <div class="panel-header-row">
          <h3>Cerca ticket storici</h3>
          <p class="muted">Cerca per parole chiave, date o entrambe per ritrovare vecchi ticket.</p>
        </div>
        <form id="ticketSearchForm" class="ticket-search-form">
          <div class="ticket-search-grid">
            <div>
              <label for="ticketSearchQuery">Parole chiave</label>
              <input id="ticketSearchQuery" type="text" placeholder="Es. reset, malware, FAB, categoria..." />
            </div>
            <div>
              <label for="ticketSearchFrom">Da data</label>
              <input id="ticketSearchFrom" type="date" />
            </div>
            <div>
              <label for="ticketSearchTo">A data</label>
              <input id="ticketSearchTo" type="date" />
            </div>
            <div>
              <label for="ticketSearchFab">FAB</label>
              <select id="ticketSearchFab">
                <option value="">Tutti</option>
                <option value="M5">M5</option>
                <option value="L1">L1</option>
                <option value="EWS">EWS</option>
                <option value="WSIC">WSIC</option>
                <option value="NRK">NRK</option>
              </select>
            </div>
            <div>
              <label for="ticketSearchCategory">Categoria</label>
              <select id="ticketSearchCategory">
                <option value="">Tutte</option>
              </select>
            </div>
            <div>
              <label for="ticketSearchIncident">Incident</label>
              <select id="ticketSearchIncident">
                <option value="">Tutti</option>
              </select>
            </div>
          </div>
          <div class="form-actions inline-actions search-actions">
            <button type="submit" class="primary">Cerca</button>
            <button type="button" id="ticketSearchResetBtn" class="secondary">Reset</button>
          </div>
        </form>
        <div id="ticketSearchSummary" class="muted ticket-search-summary">Nessuna ricerca avviata.</div>
        <div id="ticketSearchResults" class="ticket-search-results"></div>
      </section>
    </main>
  </div>

  <div class="modal" id="searchModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="searchModalTitle">Dettaglio Ticket</h3>
        <button class="close-modal" type="button">x</button>
      </div>
      <div class="ticket-form" id="searchModalBody"></div>
      <div class="datetime-actions-row" style="margin-top:12px">
        <div></div>
        <div class="form-actions inline-actions">
          <button type="button" class="secondary close-modal">Chiudi</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./public/js/search.js?v=1.4.12"></script>
  <div class="app-version-badge">v1.4.12</div>
</body>
</html>
