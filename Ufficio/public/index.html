<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incident Dashboard</title>
  <link rel="stylesheet" href="./public/css/styles.css?v=1.4.12" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-top"><img class="brand-logo" src="./public/assets/prodops-logo.svg?v=1.4.12" alt="PRODOPS Ticket Manager" /><button id="themeToggleBtn" class="theme-switch" type="button" aria-label="Cambia tema" aria-pressed="false"><span class="switch-track"><span class="switch-thumb">L</span></span></button></div>
      <nav class="menu" id="menu"></nav>
      <div class="sidebar-actions">
        <button id="openAdminBtn" class="admin-toggle-btn" type="button">Admin Panel</button>
        <a class="sidebar-link-btn" href="./search.html">Cerca ticket</a>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>
      <div class="sidebar-footer">Powered by Antonio Di Bella 2026</div>
    </aside>

    <main class="content">
      <div class="previous-shifts-row">
        <section class="panel previous-shifts-panel">
        <div class="previous-shifts-header">
          <button id="previousShiftsToggle" class="section-toggle" type="button" aria-expanded="false">
            <span class="section-toggle-main">
              <span>Ticket turni precedenti</span>
              <span id="previousShiftCounters" class="ticket-counters">
                <span class="ticket-counter-chip"><strong id="previousShiftTotalCount">0</strong><span>Totale</span></span>
              </span>
            </span>
            <span class="section-toggle-icon">+</span>
          </button>
        </div>
        <div id="previousShiftsContent" class="previous-shifts-content" hidden></div>
        </section>
        <div id="userPill" class="user-pill" style="display:none">
          <span class="user-pill-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></span>
          <span id="userPillName"></span>
        </div>
      </div>

      <section class="panel-grid">
        <article class="panel current-shift-panel">
          <div class="panel-heading-row panel-heading-with-counters current-shift-header-row">
            <div class="panel-heading-title">
              <button type="button" id="currentShiftToggle" class="shift-toggle-btn" aria-expanded="true" aria-controls="ticketList" title="Mostra/Nascondi ticket">v</button>
              <h3>Ticket turno Corrente</h3>
            </div>
            <div class="current-shift-filter">
              <div class="current-shift-filter-search">
                <input id="currentShiftFilter" type="text" placeholder="Filtra ticket..." aria-label="Filtra ticket del turno corrente" autocomplete="off" />
              </div>
              <label class="compact-toggle-label" title="Raggruppa i ticket per categoria in pile 3D">
                <input type="checkbox" id="compactVisualToggle" />
                <span>Compatta</span>
              </label>
              <div class="current-shift-sort-group">
                <div class="sort-select-row">
                  <select id="currentShiftSort" aria-label="Ordina per">
                    <option value="time">Orario</option>
                    <option value="category">Categoria</option>
                    <option value="incident">Incident</option>
                    <option value="fab">FAB</option>
                  </select>
                  <button type="button" id="currentShiftSortDir" class="sort-dir-btn" title="Inverti ordine" aria-label="Inverti ordine">↓</button>
                </div>
              </div>
            </div>
            <div id="currentShiftCounters" class="ticket-counters">
              <button class="ticket-counter-chip ticket-counter-btn active" data-filter="all" type="button"><strong id="currentShiftTotalCount">0</strong><span>Totali</span></button>
              <button class="ticket-counter-chip ticket-counter-btn" data-filter="mine" type="button"><strong id="currentShiftMineCount">0</strong><span>Tuoi</span></button>
              <button class="ticket-counter-chip ticket-counter-btn" data-filter="team" type="button"><strong id="currentShiftTeamCount">0</strong><span>Team</span></button>
            </div>
          </div>
          <p id="currentShiftFilterEmpty" class="current-shift-filter-empty" hidden>Nessun ticket corrisponde al filtro.</p>
          <ul id="ticketList" class="ticket-list"></ul>
          <div id="currentShiftResizeHandle" class="panel-resize-handle" title="Trascina per ridimensionare"></div>
        </article>
      </section>

      <section class="charts-grid" id="chartsGrid">

        <section class="panel personal-chart-panel" id="chartPanelPersonal">
          <div class="panel-heading-row personal-chart-heading">
            <h3>Ticket personali <span id="personalChartUsername" class="personal-chart-user"></span></h3>
            <div class="toggle-row personal-view-toggle">
              <button class="range-btn active" data-personal-view="mine">I tuoi</button>
              <button class="range-btn" data-personal-view="team">Team</button>
            </div>
            <div class="personal-target-control">
              <label for="personalTargetInput">Target mensile:</label>
              <input type="number" id="personalTargetInput" class="personal-target-input" min="1" max="999" value="20" />
            </div>
          </div>
          <div id="personalChart" class="personal-chart"></div>
        </section>

        <section class="panel" id="chartPanelFab">
          <div class="panel-heading-row">
            <h3>Ticket per FAB</h3>
          </div>
          <div class="toggle-row">
            <button class="range-btn year-btn" data-target="fabYear" data-mode="months">Anno</button>
            <button class="range-btn" data-target="fabYear" data-mode="q1">Q1</button>
            <button class="range-btn" data-target="fabYear" data-mode="q2">Q2</button>
            <button class="range-btn" data-target="fabYear" data-mode="q3">Q3</button>
            <button class="range-btn" data-target="fabYear" data-mode="q4">Q4</button>
            <button class="range-btn active" data-target="fabYear" data-mode="day">24h</button>
          </div>
          <div id="fabYearChart" class="chart vertical-chart"></div>
        </section>

        <section class="panel" id="chartPanelCat">
          <div class="panel-heading-row">
            <h3>Ticket per categoria</h3>
          </div>
          <div class="toggle-row">
            <button class="range-btn year-btn" data-target="catYear" data-mode="months">Anno</button>
            <button class="range-btn" data-target="catYear" data-mode="q1">Q1</button>
            <button class="range-btn" data-target="catYear" data-mode="q2">Q2</button>
            <button class="range-btn" data-target="catYear" data-mode="q3">Q3</button>
            <button class="range-btn" data-target="catYear" data-mode="q4">Q4</button>
            <button class="range-btn active" data-target="catYear" data-mode="day">24h</button>
          </div>
          <div id="catYearChart" class="chart vertical-chart"></div>
        </section>

        <section class="panel" id="chartPanelTeam">
          <div class="panel-heading-row">
            <h3>Ticket per Team</h3>
          </div>
          <div class="toggle-row">
            <button class="range-btn year-btn" data-target="teamYear" data-mode="months">Anno</button>
            <button class="range-btn" data-target="teamYear" data-mode="q1">Q1</button>
            <button class="range-btn" data-target="teamYear" data-mode="q2">Q2</button>
            <button class="range-btn" data-target="teamYear" data-mode="q3">Q3</button>
            <button class="range-btn" data-target="teamYear" data-mode="q4">Q4</button>
            <button class="range-btn active" data-target="teamYear" data-mode="day">24h</button>
          </div>
          <div id="teamYearChart" class="chart vertical-chart"></div>
        </section>

        <section class="panel" id="chartPanelSeverity">
          <div class="panel-heading-row">
            <h3>Severity Ticket</h3>
          </div>
          <div class="toggle-row">
            <button class="range-btn year-btn" data-target="severityYear" data-mode="months">Anno</button>
            <button class="range-btn" data-target="severityYear" data-mode="q1">Q1</button>
            <button class="range-btn" data-target="severityYear" data-mode="q2">Q2</button>
            <button class="range-btn" data-target="severityYear" data-mode="q3">Q3</button>
            <button class="range-btn" data-target="severityYear" data-mode="q4">Q4</button>
            <button class="range-btn active" data-target="severityYear" data-mode="day">24h</button>
          </div>
          <div id="severityYearChart" class="chart vertical-chart"></div>
        </section>

      </section>
    </main>
  </div>

  <div class="modal" id="ticketModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="ticketModalTitle">Nuovo Ticket</h3>
        <button class="close-modal" type="button">x</button>
      </div>

      <form id="ticketForm" class="ticket-form">
        <input id="incidentType" name="incidentType" type="hidden" />

        <label for="description">Descrizione problema</label>
        <textarea id="description" name="description" rows="7" required></textarea>
        <div id="presetInlineComposer" class="panel" style="display:none; margin:8px 0 10px; padding:10px 12px;"></div>

        <div class="fab-severity-row">
          <div class="fab-section">
            <p class="muted">Seleziona FAB:</p>
            <div id="fabButtons" class="fab-buttons"></div>
          </div>
          <div id="ticketSeverityGroup" class="severity-inline-group">
            <label for="ticketSeverity">Severity</label>
            <select id="ticketSeverity" name="ticketSeverity" required>
              <option value="1">1 - Low</option>
              <option value="2">2 - Medium</option>
              <option value="3">3 - High</option>
              <option value="4">4 - Extreme</option>
            </select>
            <p id="ticketSeverityHint" class="muted"></p>
          </div>
        </div>

        <input id="fabValue" name="fab" type="hidden" required />
        <div class="datetime-actions-row">
          <div class="datetime-block">
            <label for="ticketTimestamp" class="ticket-timestamp-label">Datetime</label>
            <input id="ticketTimestamp" class="ticket-timestamp-input" name="ticketTimestamp" type="datetime-local" required />
          </div>
          <div class="form-actions inline-actions">
            <button type="button" id="deleteTicketBtn" class="danger" style="display:none">Elimina</button>
            <button type="button" id="editFromReadBtn" class="secondary" style="display:none">Modifica</button>
            <button type="button" class="secondary close-modal">Annulla</button>
            <button type="submit" id="ticketSubmitBtn" class="primary">Crea Ticket</button>
          </div>
        </div>
      </form>
    </div>
    <div id="extraTicketModals" class="extra-ticket-modals"></div>
    <button id="addSameIncidentBtn" class="add-same-incident-btn" type="button" title="Aggiungi ticket stesso incident">+</button>
  </div>

  <div id="tsPopup" class="ticket-stack-popup" hidden></div>
  <script src="./public/js/script.js?v=1.4.12"></script>
  <div class="app-version-badge">v1.4.12</div>
</body>
</html>
