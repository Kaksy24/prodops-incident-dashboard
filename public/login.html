<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Incident Hub</title>
  <link rel="stylesheet" href="/public/css/styles.css?v=1.0.0" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <h1>INCIDENT HUB</h1>
      <form id="loginForm" class="login-form" action="/api/login" method="post">
        <label for="username">Utente</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <p id="loginError" class="login-error" role="alert"></p>
        <button class="primary" type="submit">Accedi</button>
      </form>
    </section>
  </main>
  <script src="/public/js/login.js?v=1.0.0"></script>
  <div class="app-version-badge">v1.0.0</div>
</body>
</html>
